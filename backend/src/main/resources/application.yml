server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lume-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lume_db}
    username: ${DB_USERNAME:lume_user}
    password: ${DB_PASSWORD:lume_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.lume: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN

security:
  compliance:
    dark-web-enabled: false

lume:
  auth:
    allow-test-header: false
    session-cookie-name: LUME_SESSION
    session-duration-hours: 12
  workspace:
    bootstrap:
      enabled: false
  ai:
    defaults:
      connect-timeout-ms: 4000
      read-timeout-ms: 30000
      retry:
        max-attempts: 2
        initial-backoff-ms: 250
        max-backoff-ms: 1500
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 6
        open-state-duration-ms: 15000
      bulkhead:
        max-concurrent-calls: 8
      rate-limiter:
        permits-per-minute: 120
  sla:
    critical-minutes: 15
    high-minutes: 60
    medium-minutes: 240
    low-minutes: 1440
  finops:
    anomaly:
      cost-threshold: 0.08
      success-rate-critical: 70.0
      success-rate-warning: 85.0
    reconciliation:
      enabled: false
      cron: "0 30 2 1 * *"
      auto-fix-credit-drift: false
      max-workspaces-per-run: 500
