server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lume-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lume_db}
    username: ${DB_USERNAME:lume_user}
    password: ${DB_PASSWORD:lume_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.lume: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN

security:
  compliance:
    dark-web-enabled: false

lume:
  ai:
    defaults:
      connect-timeout-ms: 4000
      read-timeout-ms: 30000
      retry:
        max-attempts: 2
        initial-backoff-ms: 250
        max-backoff-ms: 1500
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 6
        open-state-duration-ms: 15000
      pricing:
        input-per-1k-usd: 0.0
        output-per-1k-usd: 0.0
    providers:
      openai:
        pricing:
          input-per-1k-usd: 0.0
          output-per-1k-usd: 0.0
      anthropic:
        pricing:
          input-per-1k-usd: 0.0
          output-per-1k-usd: 0.0
      google-gemini:
        pricing:
          input-per-1k-usd: 0.0
          output-per-1k-usd: 0.0
      deepseek:
        pricing:
          input-per-1k-usd: 0.0
          output-per-1k-usd: 0.0
      xai:
        pricing:
          input-per-1k-usd: 0.0
          output-per-1k-usd: 0.0
      perplexity:
        pricing:
          input-per-1k-usd: 0.0
          output-per-1k-usd: 0.0
