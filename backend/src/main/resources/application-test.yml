spring:
  datasource:
    url: jdbc:h2:mem:lume_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

logging:
  level:
    com.lume: DEBUG

BILLING_WEBHOOK_SECRET: test-billing-webhook-secret

lume:
  auth:
    allow-test-header: true
    allow-test-auto-login: true
  workspace:
    bootstrap:
      enabled: true
  finops:
    reconciliation:
      enabled: false
