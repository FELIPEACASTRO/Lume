<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Lume</title>
  <rect width="64" height="64" rx="16" fill="#08090d" />
  <!-- L-shape puzzle pieces -->
  <!-- Top vertical piece with dots -->
  <path d="M16 6h18a2 2 0 012 2v22c-3 0-5 2-5 5s2 5 5 5H16a2 2 0 01-2-2V8a2 2 0 012-2z" fill="#eae6de" opacity="0.95"/>
  <!-- Dot pattern -->
  <g fill="#f0b429" opacity="0.6">
    <circle cx="20" cy="12" r="1.2"/><circle cx="26" cy="12" r="1.2"/><circle cx="32" cy="12" r="1.2"/>
    <circle cx="20" cy="18" r="1.2"/><circle cx="26" cy="18" r="1.2"/><circle cx="32" cy="18" r="1.2"/>
    <circle cx="20" cy="24" r="1.2"/><circle cx="26" cy="24" r="1.2"/><circle cx="32" cy="24" r="1.2"/>
  </g>
  <!-- Bottom-right circuit piece -->
  <path d="M38 38c3 0 5-2 5-5h9a2 2 0 012 2v17a2 2 0 01-2 2H38a2 2 0 01-2-2V44c3 0 5-2 5-5z" fill="#eae6de" opacity="0.88"/>
  <!-- Circuit traces -->
  <g stroke="#f0b429" stroke-width="1" fill="none" opacity="0.5">
    <path d="M42 40v5h7v6"/>
    <path d="M47 40h4v10"/>
    <circle cx="42" cy="40" r="1.5" fill="#f0b429"/>
    <circle cx="49" cy="51" r="1.5" fill="#f0b429"/>
  </g>
  <!-- Bottom-left wave piece -->
  <path d="M16 42h20v12a2 2 0 01-2 2H16a2 2 0 01-2-2v-10a2 2 0 012-2z" fill="#eae6de" opacity="0.85"/>
  <!-- Waves -->
  <g stroke="#f0b429" stroke-width="0.9" fill="none" opacity="0.55">
    <path d="M18 46q3-2 6 0t6 0t6 0"/>
    <path d="M18 50q3-2 6 0t6 0t6 0"/>
  </g>
</svg>
