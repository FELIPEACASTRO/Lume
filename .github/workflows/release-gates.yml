name: release-gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend verify
        run: mvn -q -f backend/pom.xml verify

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP Dependency Check
        run: mvn -q -f backend/pom.xml org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DsuppressionFile=backend/dependency-check-suppressions.xml

  frontend-e2e-critical:
    needs:
      - backend-verify
      - frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compose config preflight
        run: docker compose config --no-interpolate

      - name: Start stack for E2E
        run: docker compose up -d postgres backend frontend

      - name: Wait for backend and frontend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          for i in {1..90}; do
            if curl -fsS http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health > /dev/null
          curl -fsS http://localhost:3000 > /dev/null

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run critical E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:8080/api
        run: |
          npm run test
          npm run test:e2e

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --tail=200 backend

      - name: Stop stack
        if: always()
        run: docker compose down -v
